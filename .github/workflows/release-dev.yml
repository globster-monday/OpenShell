name: Publish maintained Globster images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    uses: ./.github/workflows/docker-build.yml
    with:
      component: gateway
      cargo-version: 0.0.92-globster.1
      image-tag: 0.0.92-resident-1e64e463
      platform: linux/amd64,linux/arm64
      timeout-minutes: 60
    secrets: inherit

  supervisor:
    uses: ./.github/workflows/docker-build.yml
    with:
      component: supervisor
      cargo-version: 0.0.92-globster.1
      image-tag: 0.0.92-resident-1e64e463
      platform: linux/amd64,linux/arm64
      timeout-minutes: 60
    secrets: inherit
