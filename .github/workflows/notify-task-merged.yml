name: notify-task-merged

# `branches: [main]` is load-bearing, not incidental. A task completes only when
# its PR merges into main, so a stacked child merged into its *parent* branch
# must not mark its task done — and the two tasks would collapse into one main
# commit. Keep the filter; stacks land bottom-up into main
# (guidelines/workflow.md § "Stacked PRs").
on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Never select privileged executable code from PR payload fields.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/check_task_id.py
          sparse-checkout-cone-mode: false
      - name: Parse PR task metadata
        id: task
        run: python3 scripts/check_task_id.py parse
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: workspace
        if: steps.task.outputs.task_id != 'none'
        with:
          client-id: ${{ secrets.TASK_SYNC_APP_ID }}
          private-key: ${{ secrets.TASK_SYNC_APP_PRIVATE_KEY }}
          owner: globster-monday
          repositories: workspace
          permission-contents: write
      - name: Dispatch merged task for Workspace verification
        if: steps.task.outputs.task_id != 'none'
        env:
          GITHUB_TOKEN: ${{ steps.workspace.outputs.token }}
        run: python3 scripts/check_task_id.py notify
