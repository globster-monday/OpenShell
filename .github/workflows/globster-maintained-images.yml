name: Globster maintained images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    uses: globster-monday/OpenShell/.github/workflows/docker-build.yml@a4e5b4acd155c920a3d1dc60c17b19afdada856d
    with:
      component: gateway
      cargo-version: 0.0.92-globster.1
      image-tag: 0.0.92-resident-1e64e463
      checkout-ref: 1e64e4638ca1ef772ffd3d9dcd2709fb510eed83
      platform: linux/amd64,linux/arm64
      timeout-minutes: 60
    secrets: inherit

  supervisor:
    uses: globster-monday/OpenShell/.github/workflows/docker-build.yml@a4e5b4acd155c920a3d1dc60c17b19afdada856d
    with:
      component: supervisor
      cargo-version: 0.0.92-globster.1
      image-tag: 0.0.92-resident-1e64e463
      checkout-ref: 1e64e4638ca1ef772ffd3d9dcd2709fb510eed83
      platform: linux/amd64,linux/arm64
      timeout-minutes: 60
    secrets: inherit
