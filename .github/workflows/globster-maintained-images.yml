name: Globster maintained images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    uses: globster-monday/OpenShell/.github/workflows/docker-build.yml@a4e5b4acd155c920a3d1dc60c17b19afdada856d
    with:
      component: gateway
      cargo-version: 0.0.92-globster.5
      image-tag: 0.0.92-resident-58e11af2
      checkout-ref: 58e11af2a8e3297f505802fda2ea8e02b0efc134
      platform: linux/amd64,linux/arm64
      timeout-minutes: 60
    secrets: inherit

  supervisor:
    uses: globster-monday/OpenShell/.github/workflows/docker-build.yml@a4e5b4acd155c920a3d1dc60c17b19afdada856d
    with:
      component: supervisor
      cargo-version: 0.0.92-globster.5
      image-tag: 0.0.92-resident-58e11af2
      checkout-ref: 58e11af2a8e3297f505802fda2ea8e02b0efc134
      platform: linux/amd64,linux/arm64
      timeout-minutes: 60
    secrets: inherit

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 58e11af2a8e3297f505802fda2ea8e02b0efc134

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pinned Globster chart
        run: |
          set -euo pipefail
          chart_dir="${RUNNER_TEMP}/openshell-chart"
          cp -a deploy/helm/openshell "${chart_dir}"
          sed -i 's/^version:.*/version: 0.0.92-globster.5/' "${chart_dir}/Chart.yaml"
          sed -i 's/^appVersion:.*/appVersion: "0.0.92-resident-58e11af2"/' "${chart_dir}/Chart.yaml"
          helm package "${chart_dir}" --destination "${RUNNER_TEMP}"
          helm push "${RUNNER_TEMP}/helm-chart-0.0.92-globster.5.tgz" \
            oci://ghcr.io/globster-monday/openshell
