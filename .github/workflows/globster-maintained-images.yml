name: Globster maintained images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    uses: globster-monday/OpenShell/.github/workflows/docker-build.yml@a4e5b4acd155c920a3d1dc60c17b19afdada856d
    with:
      component: gateway
      cargo-version: 0.0.92-globster.3
      image-tag: 0.0.92-resident-5b96d1ac
      checkout-ref: 5b96d1ac1af67232732a20e96bc04c17b017aabc
      platform: linux/amd64,linux/arm64
      timeout-minutes: 60
    secrets: inherit

  supervisor:
    uses: globster-monday/OpenShell/.github/workflows/docker-build.yml@a4e5b4acd155c920a3d1dc60c17b19afdada856d
    with:
      component: supervisor
      cargo-version: 0.0.92-globster.3
      image-tag: 0.0.92-resident-5b96d1ac
      checkout-ref: 5b96d1ac1af67232732a20e96bc04c17b017aabc
      platform: linux/amd64,linux/arm64
      timeout-minutes: 60
    secrets: inherit
