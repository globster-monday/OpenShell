name: Globster Gateway Release

on:
  push:
    branches:
      - codex/workspace-storage-class-v0.0.91
    paths:
      - .github/workflows/globster-gateway-release.yml
      - .globster/Dockerfile.gateway
      - Cargo.lock
      - Cargo.toml
      - crates/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: globster-gateway-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: openshell/gateway
  RELEASE_TAG: 0.0.91-globster.1

jobs:
  build:
    name: Build and publish AMD64 gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish gateway
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .globster/Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_TAG }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=openshell-gateway-amd64-v0.0.91
          cache-to: type=gha,mode=max,scope=openshell-gateway-amd64-v0.0.91
          provenance: mode=max
          sbom: true

      - name: Verify published gateway
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          output="$(docker run --rm --platform linux/amd64 "$IMAGE" --version)"
          echo "$output"
          grep -q '^openshell-gateway ' <<<"$output"

      - name: Record immutable image
        run: |
          {
            echo "### Published OpenShell gateway"
            echo
            echo '- Image: `${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_TAG }}`'
            echo '- Source: `${{ github.sha }}`'
            echo '- Digest: `${{ steps.build.outputs.digest }}`'
            echo '- Platform: `linux/amd64`'
          } >> "$GITHUB_STEP_SUMMARY"
